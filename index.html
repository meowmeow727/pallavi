<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffecd2">
    <meta name="description" content="A special message for Pallavi">
    <title>For Pallavi 💖</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Floating hearts background -->
    <div class="hearts-background">
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
    </div>

    <!-- Sparkles -->
    <div class="sparkles">
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
    </div>

    <div class="container">
        <div class="name-tag">Dear Pallavi,</div>
        <h1 class="question">Do You Love Me? 💕</h1>
        <p class="subtitle">My heart beats only for you...</p>
        
        <div class="buttons-container">
            <button id="yesBtn" class="btn yes-btn">
                <span class="btn-text">Yes, I do! 💖</span>
                <span class="btn-hearts">💕</span>
            </button>
            <button id="noBtn" class="btn no-btn">
                <span class="btn-text">No...</span>
            </button>
        </div>
        
        <div id="message" class="message"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
